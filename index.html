<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Visor Campo Valle y Bajio</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { margin:0; padding:0; font-family: Arial, sans-serif; background: #f0f0f0; }
        #map { width: 100vw; height: 100vh; }
        .popup-datos { font-size: 14px; background: #e6f2ff; padding: 10px; border-left: 4px solid #0056b3; margin-bottom: 5px;}
        .btn-listo { background: #e8f8f5; border: 1px solid #2ecc71; padding: 10px; border-radius: 5px; margin-top: 10px; display: block; }
        .btn-listo label { cursor: pointer; font-weight: bold; color: #117a65; display: flex; align-items: center; gap: 8px; font-size: 14px;}
        .btn-listo input { transform: scale(1.4); cursor: pointer; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script src="datos.js"></script>
    <script>
        var map = L.map('map').setView([29.0, -110.0], 15);
        var geojsonLayer;
        
        L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
            maxZoom: 21,
            attribution: '© Google'
        }).addTo(map);

        // AHORA USA EL UID EN LUGAR DEL ACTIVO
        function marcarListo(uid, isChecked, colorOriginal) {
            if(isChecked) {
                localStorage.setItem("casa_vb_uid_" + uid, "completado");
            } else {
                localStorage.removeItem("casa_vb_uid_" + uid);
            }
            geojsonLayer.eachLayer(function(layer) {
                if(layer.feature.properties.UID === uid) {
                    layer.setStyle({ fillColor: isChecked ? "#2ecc71" : colorOriginal });
                }
            });
        }

        function onEachFeature(feature, layer) {
            var p = feature.properties;
            var html = '<div class="popup-datos">' +
                       '<b>Activo:</b> ' + p.ACTIVO + '<br>' +
                       '<b>Casa:</b> ' + p.CASA + ' | <b>Lote:</b> ' + p.LOTE + '<br>' +
                       '<b>Manzana:</b> ' + p.MANZANA + '</div>';
            
            var colorBase = "#8e44ad"; 
            if(p.ESTADO === "ROJO") colorBase = "#e74c3c";
            if(p.ESTADO === "AMARILLO") colorBase = "#f1c40f";
            
            // Revisa si este UID específico está marcado
            var estaLista = localStorage.getItem("casa_vb_uid_" + p.UID) === "completado";
            var colorFill = estaLista ? "#2ecc71" : colorBase;
            
            if(p.ESTADO !== "MORADO") {
                var checkedAttr = estaLista ? "checked" : "";
                var msgTexto = p.ESTADO === "ROJO" ? "El activo no tiene ninguna foto." : "Falta la fotografía del Activo (ACT).";
                var msgColor = p.ESTADO === "ROJO" ? "#c0392b" : "#b7950b";
                
                html += "<div style='color:" + msgColor + "; font-size: 13px; margin-top:8px; font-weight:bold;'>" + msgTexto + "</div>" +
                        "<div class='btn-listo'>" +
                        "<label><input type='checkbox' onchange=\"marcarListo('" + p.UID + "', this.checked, '" + colorBase + "')\" " + checkedAttr + "> " +
                        "✅ Tomadas en campo (Listo)</label></div>";
            } else {
                html += "<div style='color:#8e44ad; font-size: 13px; margin-top:8px; font-weight:bold;'>✅ Fotos completas en sistema</div>";
            }
            
            layer.bindPopup(html, {maxWidth: 300});
            
            layer.setStyle({
                fillColor: colorFill,
                color: "#ffffff",
                weight: 1.5,
                fillOpacity: 0.75
            });
        }

        geojsonLayer = L.geoJSON(datos_casas, {
            onEachFeature: onEachFeature
        }).addTo(map);
        
        map.fitBounds(geojsonLayer.getBounds());
    </script>
</body>
</html>
